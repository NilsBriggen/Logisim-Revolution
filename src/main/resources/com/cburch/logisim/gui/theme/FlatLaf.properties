#
# Shared shape and density for both Logisim themes.
#
# These keys say how the interface is built rather than what colour it is: corner radii, row
# heights, how much air a control gets. Colours live in the per-theme files beside this one.
#

#---- shape ----
Component.arc = 8
Button.arc = 8
CheckBox.arc = 4
ProgressBar.arc = 8
TextComponent.arc = 6

#---- focus ----
Component.focusWidth = 1
Component.innerFocusWidth = 1
Button.innerFocusWidth = 1

#---- scroll bars ----
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.showButtons = false
ScrollBar.trackArc = 999

#---- tabs ----
TabbedPane.tabType = card
TabbedPane.showTabSeparators = true
TabbedPane.tabHeight = 32
TabbedPane.tabInsets = 4,12,4,12
TabbedPane.contentSeparatorHeight = 1
TabbedPane.tabsPopupPolicy = asNeeded
TabbedPane.scrollButtonsPolicy = asNeeded

#---- trees and tables ----
Tree.paintLines = false
Tree.rowHeight = 24
Tree.showDefaultIcons = false
Table.rowHeight = 24
Table.showHorizontalLines = false
Table.showVerticalLines = false
Table.intercellSpacing = 0,0
List.rowHeight = 24

#---- split panes ----
# A thin plain divider: the panels are told apart by their own backgrounds, not by a moulded bar.
SplitPane.dividerSize = 5
SplitPaneDivider.style = plain
SplitPaneDivider.gripDotCount = 0

#---- window chrome ----
# One continuous surface from the title bar down, with the menu bar sitting inside it.
TitlePane.unifiedBackground = true
TitlePane.menuBarEmbedded = true
TitlePane.centerTitle = false
TitlePane.showIcon = false

#---- menus ----
MenuItem.selectionArc = 6
MenuBar.itemMargins = 4,10,4,10
PopupMenu.borderInsets = 4,1,4,1

#---- misc ----
ToolTip.borderInsets = 4,8,4,8
OptionPane.showIcon = true
