#
# Logisim dark theme.
#

@accentColor = #4c8dff
@background = #1e1f22
@foreground = #dfe1e5
@selectionBackground = @accentColor
@selectionInactiveBackground = lighten($@background,12%)

#---- surfaces ----
Component.borderColor = lighten($@background,16%)
Component.disabledBorderColor = lighten($@background,10%)
Separator.foreground = lighten($@background,14%)
Panel.background = $@background
MenuBar.background = $@background
TitlePane.background = $@background
ScrollPane.background = $@background

#---- roles used by the application's own painting ----
Logisim.accent = @accentColor
# Text drawn on the accent fill. White on #4c8dff is only 3.2:1, so this uses the same dark ink
# FlatLaf picks for the selection foreground (about 5.8:1).
Logisim.accentText = @selectionForeground
Logisim.warning = #e2b13c
Logisim.error = #f26d6d
Logisim.success = #55c57e
Logisim.divider = lighten($@background,14%)
Logisim.mutedForeground = #9ca5b4
Logisim.icon.foreground = darken($@foreground,12%)
Logisim.icon.disabled = darken($@foreground,50%)
Logisim.activityBar.background = #181a1e
Logisim.activityBar.foreground = #9ca5b4
Logisim.sidePanel.background = $@background
Logisim.sidePanel.headerForeground = #9ca5b4
Logisim.statusBar.background = #181a1e
Logisim.statusBar.foreground = darken($@foreground,18%)
Logisim.badge.background = lighten($@background,16%)
Logisim.toast.background = lighten($@background,10%)
Logisim.preview.background = #181a1e
Logisim.canvas.halo = @accentColor
