#
# Logisim dark theme.
#

@accentColor = #4c8dff
@background = #1e1f22
@foreground = #dfe1e5
@selectionBackground = @accentColor
@selectionInactiveBackground = tint($@background,12%)

#---- surfaces ----
Component.borderColor = tint($@background,16%)
Component.disabledBorderColor = tint($@background,10%)
Separator.foreground = tint($@background,14%)
Panel.background = $@background
MenuBar.background = $@background
TitlePane.background = $@background
ScrollPane.background = $@background

#---- roles used by the application's own painting ----
Logisim.accent = @accentColor
Logisim.accentText = #ffffff
Logisim.warning = #e2b13c
Logisim.error = #f26d6d
Logisim.success = #55c57e
Logisim.divider = tint($@background,14%)
Logisim.mutedForeground = shade($@foreground,38%)
Logisim.icon.foreground = shade($@foreground,12%)
Logisim.icon.disabled = shade($@foreground,50%)
Logisim.activityBar.background = shade($@background,25%)
Logisim.activityBar.foreground = shade($@foreground,38%)
Logisim.sidePanel.background = $@background
Logisim.sidePanel.headerForeground = shade($@foreground,38%)
Logisim.statusBar.background = shade($@background,25%)
Logisim.statusBar.foreground = shade($@foreground,18%)
Logisim.badge.background = tint($@background,16%)
Logisim.toast.background = tint($@background,10%)
Logisim.canvas.halo = @accentColor
