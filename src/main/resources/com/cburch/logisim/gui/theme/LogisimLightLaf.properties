#
# Logisim light theme.
#

@accentColor = #2f6fed
@background = #f6f7f9
@foreground = #1f2328
@selectionBackground = @accentColor
@selectionInactiveBackground = shade($@background,10%)

#---- surfaces ----
Component.borderColor = shade($@background,14%)
Component.disabledBorderColor = shade($@background,9%)
Separator.foreground = shade($@background,12%)
Panel.background = $@background
MenuBar.background = $@background
TitlePane.background = $@background
ScrollPane.background = $@background

#---- roles used by the application's own painting ----
Logisim.accent = @accentColor
Logisim.accentText = #ffffff
Logisim.warning = #b7791f
Logisim.error = #d33a3a
Logisim.success = #1d8a4e
Logisim.divider = shade($@background,14%)
Logisim.mutedForeground = tint($@foreground,42%)
Logisim.icon.foreground = tint($@foreground,18%)
Logisim.icon.disabled = tint($@foreground,58%)
Logisim.activityBar.background = shade($@background,5%)
Logisim.activityBar.foreground = tint($@foreground,40%)
Logisim.sidePanel.background = $@background
Logisim.sidePanel.headerForeground = tint($@foreground,42%)
Logisim.statusBar.background = shade($@background,5%)
Logisim.statusBar.foreground = tint($@foreground,25%)
Logisim.badge.background = shade($@background,12%)
Logisim.toast.background = #ffffff
Logisim.canvas.halo = @accentColor
