#
# Logisim light theme.
#

@accentColor = #2f6fed
@background = #f6f7f9
@foreground = #1f2328
@selectionBackground = @accentColor
@selectionInactiveBackground = darken($@background,10%)

#---- surfaces ----
Component.borderColor = darken($@background,14%)
Component.disabledBorderColor = darken($@background,9%)
Separator.foreground = darken($@background,12%)
Panel.background = $@background
MenuBar.background = $@background
TitlePane.background = $@background
ScrollPane.background = $@background

#---- roles used by the application's own painting ----
Logisim.accent = @accentColor
Logisim.accentText = #ffffff
Logisim.warning = #b7791f
Logisim.error = #d33a3a
Logisim.success = #1d8a4e
Logisim.divider = darken($@background,14%)
Logisim.mutedForeground = #596273
Logisim.icon.foreground = lighten($@foreground,18%)
Logisim.icon.disabled = lighten($@foreground,58%)
Logisim.activityBar.background = darken($@background,5%)
Logisim.activityBar.foreground = #596273
Logisim.sidePanel.background = $@background
Logisim.sidePanel.headerForeground = #596273
Logisim.statusBar.background = darken($@background,5%)
Logisim.statusBar.foreground = lighten($@foreground,25%)
Logisim.badge.background = darken($@background,12%)
Logisim.toast.background = #ffffff
Logisim.canvas.halo = @accentColor
