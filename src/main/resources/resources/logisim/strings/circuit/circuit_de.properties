circuitNameSyntaxError = „%s“ kann keine Schaltung benennen: Ein Name muss mit einem Buchstaben beginnen, darf nur Buchstaben, Ziffern und einzelne Unterstriche enthalten und darf nicht mit einem Unterstrich enden.
