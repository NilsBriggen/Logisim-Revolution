verilogComponent = Verilogモジュール
verilogDuplicateNameError = 無効な Verilog モジュール名です。名前は一意でなければなりません。
verilogInvalidNameError = 無効な Verilog モジュール名です。名前は\n *文字から始まる\n *文字、数字、アンダースコアのみを含む\n *アンダースコアで終わらない\n *2つの連続したアンダースコアを含まない\n *ものでなければいけません。
verilogKeywordNameError = 無効な Verilog モジュール名です。予約済みの Verilog または VHDL キーワードです。
verilogModuleName = Verilog モジュール名
verilogParseError = Verilog 解析エラー
#
# base/VerilogParser.java
#
verilogArrayPortError = ポート「%s」は配列です。単一の信号や[7:0]のようなバスのみがポートとして使用できます。
verilogDuplicatePortError = ポート「%s」は2回宣言されています。
verilogEmptyError = モジュールが空です。module name (input a, output q); ... endmodule のようなモジュール宣言を記述してください。
verilogEndOfText = テキストの終端
verilogErrorAtLine = 行 %d: %s
verilogHeaderEndError = ポートリストの後に「;」が必要ですが、%s が見つかりました。
verilogIdentifierError = 「%s」はここでは名前として使用できません。文字またはアンダースコアで始まり、文字、数字、アンダースコアのみを使用してください。
verilogModuleNameError = 「module」の後にモジュール名が必要です。
verilogNestedModuleError = 「endmodule」の前に2つ目のモジュールが始まっています。「endmodule」でモジュールを閉じてください。
verilogNoEndmoduleError = モジュール「%s」に「endmodule」がありません。
verilogNoModuleError = モジュール宣言が見つかりません。テキストは module name ( ... ); で始まる必要があります。
verilogNonAnsiError = ポート「%s」に方向がありません。ANSIスタイルのヘッダーのみサポートされています。ヘッダー内ですべてのポートを宣言してください（例: (input a, output [7:0] q)）。
verilogOpenCommentError = このコメントは「*/」で閉じられていません。
verilogParameterListError = パラメータリスト（#(...)）はサポートされていません。Logisimは固定のポート幅を必要とします。モジュール内でlocalparamを使用してください。
verilogPortDefaultError = ポート「%s」にデフォルト値が設定されていますが、サポートされていません。
verilogPortExpectedError = 「input a」のようなポート宣言が必要ですが、%s が見つかりました。
verilogPortSeparatorError = ポートリストに「,」または「)」が必要ですが、%s が見つかりました。
verilogPortTypeError = ポート名が必要ですが、%s が見つかりました。サポートされているポートタイプは wire、reg、logic（signed修飾可）です。
verilogPortWidthError = ポート「%s」は%dビット幅ですが、最大%dビットまでサポートされています。
verilogRangeError = ポートの範囲は[7:0]のような整数定数でなければなりません。式やパラメータはサポートされていません。
verilogSecondModuleError = ここには1つのモジュールしか記述できません。各モジュールを個別のVerilogモジュールとして追加してください。
verilogTrailingTextError = 「endmodule」の後に予期しない %s があります。
