verilogComponent = Módulo Verilog
verilogDuplicateNameError = Nome de módulo Verilog inválido. Os nomes devem ser únicos.
verilogInvalidNameError = Nome de módulo Verilog inválido. Os nomes devem:\n * começar com uma letra,\n * conter apenas letras, números e sublinhados,\n * não terminar com um sublinhado,\n * não conter dois sublinhados consecutivos.
verilogKeywordNameError = Nome de módulo Verilog inválido. Essa é uma palavra reservada em Verilog ou VHDL.
verilogModuleName = Nome do Módulo Verilog
verilogParseError = Erro de Análise do Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = A porta '%s' é um vetor. Apenas sinais únicos e barramentos como [7:0] podem ser portas.
verilogDuplicatePortError = A porta '%s' está declarada duas vezes.
verilogEmptyError = O módulo está vazio. Escreva uma declaração de módulo como: module name (input a, output q); ... endmodule
verilogEndOfText = o fim do texto
verilogErrorAtLine = Linha %d: %s
verilogHeaderEndError = Esperado ';' após a lista de portas, encontrado %s.
verilogIdentifierError = '%s' não pode ser usado como nome aqui. Use letras, dígitos e sublinhados, começando com uma letra ou sublinhado.
verilogModuleNameError = Esperado o nome do módulo após 'module'.
verilogNestedModuleError = Um segundo módulo começa antes de 'endmodule'. Feche o módulo com 'endmodule'.
verilogNoEndmoduleError = O módulo '%s' não tem 'endmodule'.
verilogNoModuleError = Não foi possível encontrar uma declaração de módulo. O texto deve começar com: module name ( ... );
verilogNonAnsiError = A porta '%s' não tem direção. Apenas cabeçalhos no estilo ANSI são suportados: declare cada porta no cabeçalho, ex.: (input a, output [7:0] q).
verilogOpenCommentError = Este comentário nunca é fechado com '*/'.
verilogParameterListError = Listas de parâmetros (#(...)) não são suportadas: o Logisim precisa de larguras de porta fixas. Use localparam dentro do módulo em vez disso.
verilogPortDefaultError = A porta '%s' tem um valor padrão, o que não é suportado.
verilogPortExpectedError = Esperada uma declaração de porta como 'input a', encontrado %s.
verilogPortSeparatorError = Esperado ',' ou ')' na lista de portas, encontrado %s.
verilogPortTypeError = Esperado um nome de porta, encontrado %s. Os tipos de porta suportados são wire, reg e logic, opcionalmente signed.
verilogPortWidthError = A porta '%s' tem %d bits de largura; no máximo %d bits são suportados.
verilogRangeError = Os intervalos de porta devem ser constantes inteiras como [7:0]; expressões e parâmetros não são suportados.
verilogSecondModuleError = Apenas um módulo pode ser descrito aqui. Adicione cada módulo como seu próprio módulo Verilog.
verilogTrailingTextError = %s inesperado após 'endmodule'.
