verilogValidationSuccess = Nagłówek modułu jest poprawny: sprawdzono jego nazwę i porty.\nCiało modułu nie jest sprawdzane; błędy w nim są zgłaszane przez narzędzia syntezy.\nLogisim nie symuluje Verilog: wyjścia modułu pozostają nieznane w symulatorze.
verilogValidationSuccessTitle = Walidacja Verilog
