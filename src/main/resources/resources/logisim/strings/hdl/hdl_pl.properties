verilogComponent = Moduł Verilog
verilogDuplicateNameError = Nieprawidłowa nazwa modułu Verilog. Nazwy muszą być unikalne.
verilogInvalidNameError = Nieprawidłowa nazwa modułu Verilog. Nazwy muszą:\n * zaczynać się literą,\n * zawierać wyłącznie litery, cyfry i podkreślenia,\n * nie kończyć się podkreśleniem,\n * nie zawierać dwóch kolejnych podkreśleń.
verilogKeywordNameError = Nieprawidłowa nazwa modułu Verilog. To zastrzeżone słowo kluczowe Verilog lub VHDL.
verilogModuleName = Nazwa modułu Verilog
verilogParseError = Błąd analizy Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = Port „%s” jest tablicą. Tylko pojedyncze sygnały i magistrale takie jak [7:0] mogą być portami.
verilogDuplicatePortError = Port „%s” jest zadeklarowany dwukrotnie.
verilogEmptyError = Moduł jest pusty. Napisz deklarację modułu, np.: module name (input a, output q); ... endmodule
verilogEndOfText = koniec tekstu
verilogErrorAtLine = Wiersz %d: %s
verilogHeaderEndError = Oczekiwano „;” po liście portów, znaleziono %s.
verilogIdentifierError = „%s” nie może być tu użyte jako nazwa. Użyj liter, cyfr i podkreśleń, zaczynając od litery lub podkreślenia.
verilogModuleNameError = Oczekiwano nazwy modułu po „module”.
verilogNestedModuleError = Drugi moduł zaczyna się przed „endmodule”. Zamknij moduł za pomocą „endmodule”.
verilogNoEndmoduleError = Moduł „%s” nie ma „endmodule”.
verilogNoModuleError = Nie znaleziono deklaracji modułu. Tekst musi zaczynać się od: module name ( ... );
verilogNonAnsiError = Port „%s” nie ma kierunku. Obsługiwane są tylko nagłówki w stylu ANSI: zadeklaruj każdy port w nagłówku, np. (input a, output [7:0] q).
verilogOpenCommentError = Ten komentarz nie jest nigdy zamknięty za pomocą „*/”.
verilogParameterListError = Listy parametrów (#(...)) nie są obsługiwane: Logisim wymaga stałych szerokości portów. Zamiast tego użyj localparam wewnątrz modułu.
verilogPortDefaultError = Port „%s” ma wartość domyślną, która nie jest obsługiwana.
verilogPortExpectedError = Oczekiwano deklaracji portu, np. „input a”, znaleziono %s.
verilogPortSeparatorError = Oczekiwano „,” lub „)” na liście portów, znaleziono %s.
verilogPortTypeError = Oczekiwano nazwy portu, znaleziono %s. Obsługiwane typy portów to wire, reg i logic, opcjonalnie signed.
verilogPortWidthError = Port „%s” ma szerokość %d bitów; obsługiwane jest co najwyżej %d bitów.
verilogRangeError = Zakresy portów muszą być stałymi całkowitymi, np. [7:0]; wyrażenia i parametry nie są obsługiwane.
verilogSecondModuleError = Tutaj można opisać tylko jeden moduł. Dodaj każdy moduł jako osobny moduł Verilog.
verilogTrailingTextError = Nieoczekiwane %s po „endmodule”.
