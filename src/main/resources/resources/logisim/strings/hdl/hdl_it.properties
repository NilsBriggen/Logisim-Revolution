verilogComponent = Modulo Verilog
verilogDuplicateNameError = Nome del modulo Verilog non valido. I nomi devono essere univoci.
verilogInvalidNameError = Nome del modulo Verilog non valido. I nomi devono:\n * iniziare con una lettera,\n * contenere solo lettere, numeri e trattini bassi,\n * non terminare con un trattino basso,\n * non contenere due trattini bassi consecutivi.
verilogKeywordNameError = Nome del modulo Verilog non valido. Si tratta di una parola chiave riservata di Verilog o VHDL.
verilogModuleName = Nome del Modulo Verilog
verilogParseError = Errore di Analisi Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = La porta '%s' è un array. Solo segnali singoli e bus come [7:0] possono essere porte.
verilogDuplicatePortError = La porta '%s' è dichiarata due volte.
verilogEmptyError = Il modulo è vuoto. Scrivi una dichiarazione di modulo come: module name (input a, output q); ... endmodule
verilogIdentifierError = '%s' non può essere usato come nome qui. Usa lettere, cifre e trattini bassi, iniziando con una lettera o un trattino basso.
verilogEndOfText = la fine del testo
verilogErrorAtLine = Riga %d: %s
verilogHeaderEndError = Atteso ';' dopo l'elenco delle porte, trovato %s.
verilogModuleNameError = Atteso il nome del modulo dopo 'module'.
verilogNestedModuleError = Un secondo modulo inizia prima di 'endmodule'. Chiudi il modulo con 'endmodule'.
verilogNoEndmoduleError = Il modulo '%s' non ha 'endmodule'.
verilogNoModuleError = Impossibile trovare una dichiarazione di modulo. Il testo deve iniziare con: module name ( ... );
verilogNonAnsiError = La porta '%s' non ha una direzione. Sono supportate solo intestazioni in stile ANSI: dichiara ogni porta nell'intestazione, ad es. (input a, output [7:0] q).
verilogOpenCommentError = Questo commento non viene mai chiuso con '*/'.
verilogParameterListError = Le liste di parametri (#(...)) non sono supportate: Logisim richiede larghezze di porta fisse. Usa localparam all'interno del modulo.
verilogPortDefaultError = La porta '%s' ha un valore predefinito, che non è supportato.
verilogPortExpectedError = Attesa una dichiarazione di porta come 'input a', trovato %s.
verilogPortSeparatorError = Atteso ',' o ')' nell'elenco delle porte, trovato %s.
verilogPortTypeError = Atteso un nome di porta, trovato %s. I tipi di porta supportati sono wire, reg e logic, opzionalmente signed.
verilogPortWidthError = La porta '%s' è larga %d bit; sono supportati al massimo %d bit.
verilogRangeError = Gli intervalli delle porte devono essere costanti intere come [7:0]; espressioni e parametri non sono supportati.
verilogSecondModuleError = Qui può essere descritto solo un modulo. Aggiungi ogni modulo come proprio modulo Verilog.
verilogTrailingTextError = %s inatteso dopo 'endmodule'.
