verilogComponent = Verilog-Modul
verilogDuplicateNameError = Ungültiger Verilog-Modulname. Namen müssen eindeutig sein.
verilogInvalidNameError = Ungültiger Verilog-Modulname. Namen müssen:\n * mit einem Buchstaben beginnen,\n * nur Buchstaben, Zahlen und Unterstriche enthalten,\n * nicht mit einem Unterstrich enden,\n * keine zwei aufeinanderfolgenden Unterstriche enthalten.
verilogKeywordNameError = Ungültiger Verilog-Modulname. Das ist ein reserviertes Verilog- oder VHDL-Schlüsselwort.
verilogModuleName = Verilog-Modulname
