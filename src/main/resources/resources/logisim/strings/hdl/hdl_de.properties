#
# base/VerilogParser.java
#
verilogArrayPortError = Port '%s' ist ein Array. Nur einzelne Signale und Busse wie [7:0] können Ports sein.
verilogDuplicatePortError = Port '%s' ist doppelt deklariert.
verilogEmptyError = Das Modul ist leer. Schreiben Sie eine Moduldeklaration wie: module name (input a, output q); ... endmodule
verilogEndOfText = das Ende des Textes
verilogErrorAtLine = Zeile %d: %s
verilogHeaderEndError = Nach der Port-Liste wurde ';' erwartet, gefunden wurde %s.
verilogIdentifierError = '%s' kann hier nicht als Name verwendet werden. Verwenden Sie Buchstaben, Ziffern und Unterstriche, beginnend mit einem Buchstaben oder Unterstrich.
verilogModuleNameError = Nach 'module' wurde der Modulname erwartet.
verilogNestedModuleError = Ein zweites Modul beginnt vor 'endmodule'. Schließen Sie das Modul mit 'endmodule' ab.
verilogNoEndmoduleError = Modul '%s' hat kein 'endmodule'.
verilogNoModuleError = Es wurde keine Moduldeklaration gefunden. Der Text muss mit Folgendem beginnen: module name ( ... );
verilogNonAnsiError = Port '%s' hat keine Richtung. Nur Header im ANSI-Stil werden unterstützt: Deklarieren Sie jeden Port im Header, z. B. (input a, output [7:0] q).
verilogOpenCommentError = Dieser Kommentar wird nie mit '*/' geschlossen.
verilogParameterListError = Parameterlisten (#(...)) werden nicht unterstützt: Logisim benötigt feste Portbreiten. Verwenden Sie stattdessen localparam innerhalb des Moduls.
verilogPortDefaultError = Port '%s' hat einen Standardwert, der nicht unterstützt wird.
verilogPortExpectedError = Es wurde eine Port-Deklaration wie 'input a' erwartet, gefunden wurde %s.
verilogPortSeparatorError = In der Port-Liste wurde ',' oder ')' erwartet, gefunden wurde %s.
verilogPortTypeError = Es wurde ein Portname erwartet, gefunden wurde %s. Unterstützte Porttypen sind wire, reg und logic, optional signed.
verilogPortWidthError = Port '%s' ist %d Bit breit; es werden höchstens %d Bit unterstützt.
verilogRangeError = Portbereiche müssen ganzzahlige Konstanten wie [7:0] sein; Ausdrücke und Parameter werden nicht unterstützt.
verilogSecondModuleError = Hier kann nur ein Modul beschrieben werden. Fügen Sie jedes Modul als eigenes Verilog-Modul hinzu.
verilogTrailingTextError = Unerwartetes %s nach 'endmodule'.
