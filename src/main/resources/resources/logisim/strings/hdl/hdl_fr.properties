verilogComponent = Module Verilog
verilogDuplicateNameError = Nom de module Verilog invalide. Les noms doivent être uniques.
verilogInvalidNameError = Nom de module Verilog invalide. Les noms doivent :\n * commencer par une lettre,\n * ne contenir que des lettres, des chiffres et des traits de soulignement,\n * ne pas se terminer par un trait de soulignement,\n * ne pas contenir deux soulignements consécutifs.
verilogKeywordNameError = Nom de module Verilog invalide. C’est un mot-clé réservé de Verilog ou de VHDL.
verilogModuleName = Nom du module Verilog
verilogParseError = Erreur d’analyse Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = Le port « %s » est un tableau. Seuls les signaux simples et les bus tels que [7:0] peuvent être des ports.
verilogDuplicatePortError = Le port « %s » est déclaré deux fois.
verilogEmptyError = Le module est vide. Écrivez une déclaration de module telle que : module name (input a, output q); ... endmodule
verilogEndOfText = la fin du texte
verilogErrorAtLine = Ligne %d : %s
verilogHeaderEndError = « ; » attendu après la liste des ports, trouvé %s.
verilogIdentifierError = « %s » ne peut pas être utilisé comme nom ici. Utilisez des lettres, des chiffres et des traits de soulignement, en commençant par une lettre ou un trait de soulignement.
verilogModuleNameError = Le nom du module est attendu après « module ».
verilogNestedModuleError = Un second module commence avant « endmodule ». Fermez le module avec « endmodule ».
verilogNoEndmoduleError = Le module « %s » n’a pas de « endmodule ».
verilogNoModuleError = Impossible de trouver une déclaration de module. Le texte doit commencer par : module name ( ... );
verilogNonAnsiError = Le port « %s » n’a pas de direction. Seuls les en-têtes de style ANSI sont pris en charge : déclarez chaque port dans l’en-tête, par ex. (input a, output [7:0] q).
verilogOpenCommentError = Ce commentaire n’est jamais fermé par « */ ».
verilogParameterListError = Les listes de paramètres (#(...)) ne sont pas prises en charge : Logisim a besoin de largeurs de port fixes. Utilisez localparam à l’intérieur du module à la place.
verilogPortDefaultError = Le port « %s » a une valeur par défaut, ce qui n’est pas pris en charge.
verilogPortExpectedError = Une déclaration de port telle que « input a » était attendue, trouvé %s.
verilogPortSeparatorError = « , » ou « ) » attendu dans la liste des ports, trouvé %s.
verilogPortTypeError = Nom de port attendu, trouvé %s. Les types de port pris en charge sont wire, reg et logic, éventuellement signed.
verilogPortWidthError = Le port « %s » fait %d bits de large ; %d bits au maximum sont pris en charge.
verilogRangeError = Les plages de port doivent être des constantes entières telles que [7:0] ; les expressions et les paramètres ne sont pas pris en charge.
verilogSecondModuleError = Un seul module peut être décrit ici. Ajoutez chaque module comme son propre module Verilog.
verilogTrailingTextError = %s inattendu après « endmodule ».
