verilogComponent = Μονάδα Verilog
verilogDuplicateNameError = Μη έγκυρο όνομα μονάδας Verilog. Τα ονόματα πρέπει να είναι μοναδικά.
verilogInvalidNameError = Μη έγκυρο όνομα μονάδας Verilog. Τα ονόματα πρέπει:\n * να ξεκινούν με γράμμα,\n * να περιέχουν μόνο γράμματα, αριθμούς και κάτω παύλες,\n * να μην τελειώνουν με κάτω παύλα,\n * να μην περιέχουν δύο διαδοχικές κάτω παύλες.
verilogKeywordNameError = Μη έγκυρο όνομα μονάδας Verilog. Πρόκειται για δεσμευμένη λέξη-κλειδί της Verilog ή της VHDL.
verilogModuleName = Όνομα Μονάδας Verilog
verilogParseError = Σφάλμα Ανάλυσης Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = Η θύρα '%s' είναι πίνακας. Μόνο μεμονωμένα σήματα και δέσμες όπως [7:0] μπορούν να είναι θύρες.
verilogDuplicatePortError = Η θύρα '%s' δηλώνεται δύο φορές.
verilogEmptyError = Η μονάδα είναι κενή. Γράψτε μια δήλωση μονάδας όπως: module name (input a, output q); ... endmodule
verilogEndOfText = το τέλος του κειμένου
verilogErrorAtLine = Γραμμή %d: %s
verilogHeaderEndError = Αναμενόταν ';' μετά τη λίστα θυρών, βρέθηκε %s.
verilogIdentifierError = Το '%s' δεν μπορεί να χρησιμοποιηθεί ως όνομα εδώ. Χρησιμοποιήστε γράμματα, ψηφία και κάτω παύλες, ξεκινώντας με γράμμα ή κάτω παύλα.
verilogModuleNameError = Αναμενόταν το όνομα της μονάδας μετά το 'module'.
verilogNestedModuleError = Μια δεύτερη μονάδα ξεκινά πριν το 'endmodule'. Κλείστε τη μονάδα με 'endmodule'.
verilogNoEndmoduleError = Η μονάδα '%s' δεν έχει 'endmodule'.
verilogNoModuleError = Δεν βρέθηκε δήλωση μονάδας. Το κείμενο πρέπει να ξεκινά με: module name ( ... );
verilogNonAnsiError = Η θύρα '%s' δεν έχει κατεύθυνση. Υποστηρίζονται μόνο επικεφαλίδες τύπου ANSI: δηλώστε κάθε θύρα στην επικεφαλίδα, π.χ. (input a, output [7:0] q).
verilogOpenCommentError = Αυτό το σχόλιο δεν κλείνει ποτέ με '*/'.
verilogParameterListError = Λίστες παραμέτρων (#(...)) δεν υποστηρίζονται: το Logisim χρειάζεται σταθερά πλάτη θυρών. Χρησιμοποιήστε localparam μέσα στη μονάδα αντ' αυτού.
verilogPortDefaultError = Η θύρα '%s' έχει προεπιλεγμένη τιμή, η οποία δεν υποστηρίζεται.
verilogPortExpectedError = Αναμενόταν δήλωση θύρας όπως 'input a', βρέθηκε %s.
verilogPortSeparatorError = Αναμενόταν ',' ή ')' στη λίστα θυρών, βρέθηκε %s.
verilogPortTypeError = Αναμενόταν όνομα θύρας, βρέθηκε %s. Υποστηριζόμενοι τύποι θυρών είναι wire, reg και logic, προαιρετικά signed.
verilogPortWidthError = Η θύρα '%s' έχει πλάτος %d bits· υποστηρίζονται το πολύ %d bits.
verilogRangeError = Τα εύρη θυρών πρέπει να είναι ακέραιες σταθερές όπως [7:0]· εκφράσεις και παράμετροι δεν υποστηρίζονται.
verilogSecondModuleError = Μόνο μία μονάδα μπορεί να περιγραφεί εδώ. Προσθέστε κάθε μονάδα ως ξεχωριστή μονάδα Verilog.
verilogTrailingTextError = Απρόσμενο %s μετά το 'endmodule'.
#
# gui/HdlContentView.java, gui/HdlToolbarModel.java
#
verilogEditAction = Επεξεργασία Verilog
verilogOpenButton = Εισαγωγή Verilog…
verilogSaveButton = Εξαγωγή Verilog…
verilogSaveDialog = Εξαγωγή αρχείου Verilog
verilogValidateButton = Επικύρωση Verilog
verilogValidationSuccess = Η επικεφαλίδα της μονάδας είναι έγκυρη: ελέγχθηκαν το όνομά της και οι θύρες της.\nΤο σώμα της μονάδας δεν ελέγχεται· σφάλματα σε αυτό αναφέρονται από τα εργαλεία σύνθεσης.\nΤο Logisim δεν προσομοιώνει Verilog: οι έξοδοι της μονάδας παραμένουν άγνωστες στον προσομοιωτή.
verilogValidationSuccessTitle = Επικύρωση Verilog
