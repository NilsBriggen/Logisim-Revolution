validationSuccessEntityOnly = Η δήλωση της οντότητας είναι έγκυρη: ελέγχθηκαν το όνομά της, οι θύρες και τα generics.\nΗ αρχιτεκτονική δεν ελέγχθηκε· σφάλματα σε αυτήν αναφέρονται από τα εργαλεία σύνθεσης (ή από την επικύρωση QuestaSim, αν είναι ενεργοποιημένη στις προτιμήσεις).
validationSuccessQuesta = Το QuestaSim μεταγλώττισε τη VHDL χωρίς σφάλματα, και η δήλωση της οντότητας είναι έγκυρη.
validationSuccessTitle = Επικύρωση VHDL
