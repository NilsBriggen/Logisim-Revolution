#
# base/VerilogContent.java, base/VerilogModule.java
#
verilogComponent = Verilog 模块
verilogDuplicateNameError = 无效的 Verilog 模块名称。名称必须唯一。
verilogInvalidNameError = 无效的 Verilog 模块名称。名称必须：\n * 以字母开头，\n * 只能包含字母、数字和下划线，\n * 不能以下划线结尾，\n * 不能包含连续两个下划线。
verilogKeywordNameError = 无效的 Verilog 模块名称。这是一个保留的 Verilog 或 VHDL 关键字。
verilogModuleName = Verilog 模块名称
verilogParseError = Verilog 解析错误
#
# base/VerilogParser.java
#
verilogArrayPortError = 端口“%s”是一个数组。只有单个信号和如 [7:0] 这样的总线可以作为端口。
verilogDuplicatePortError = 端口“%s”被声明了两次。
verilogEmptyError = 该模块为空。请编写一个模块声明，例如：module name (input a, output q); ... endmodule
verilogEndOfText = 文本结尾
verilogErrorAtLine = 第 %d 行：%s
verilogHeaderEndError = 端口列表之后应有“;”，但发现的是 %s。
verilogIdentifierError = 此处不能使用“%s”作为名称。请使用字母、数字和下划线，且以字母或下划线开头。
verilogModuleNameError = 在“module”之后应有模块名称。
verilogNestedModuleError = 在“endmodule”之前又出现了一个模块。请先用“endmodule”结束该模块。
verilogNoEndmoduleError = 模块“%s”没有“endmodule”。
verilogNoModuleError = 找不到模块声明。文本必须以下列形式开头：module name ( ... );
verilogNonAnsiError = 端口“%s”没有方向。仅支持 ANSI 风格的头部：请在头部声明每个端口，例如 (input a, output [7:0] q)。
verilogOpenCommentError = 此注释没有用“*/”关闭。
verilogParameterListError = 不支持参数列表 (#(...))：Logisim 需要固定的端口宽度。请改用模块内的 localparam。
verilogPortDefaultError = 端口“%s”有默认值，但不受支持。
verilogPortExpectedError = 应有类似“input a”的端口声明，但发现的是 %s。
verilogPortSeparatorError = 端口列表中应有“,”或“)”，但发现的是 %s。
verilogPortTypeError = 应有端口名称，但发现的是 %s。支持的端口类型为 wire、reg 和 logic，可选 signed。
verilogPortWidthError = 端口“%s”宽度为 %d 位；最多支持 %d 位。
verilogRangeError = 端口范围必须是整数常量，例如 [7:0]；不支持表达式和参数。
verilogSecondModuleError = 此处只能描述一个模块。请将每个模块作为单独的 Verilog 模块添加。
verilogTrailingTextError = “endmodule”之后出现了意外的 %s。
