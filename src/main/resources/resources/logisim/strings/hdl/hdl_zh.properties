verilogValidationSuccess = 模块头部有效：已检查其名称和端口。\n模块主体不会被检查；其中的错误将由综合工具报告。\nLogisim 不会仿真 Verilog：该模块的输出在仿真器中始终为未知。
verilogValidationSuccessTitle = Verilog 验证
