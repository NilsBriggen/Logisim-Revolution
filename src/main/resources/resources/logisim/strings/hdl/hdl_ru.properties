verilogValidateButton = Проверить Verilog
verilogValidationSuccess = Заголовок модуля корректен: проверены его имя и порты.\nТело модуля не проверяется; ошибки в нём сообщаются средствами синтеза.\nLogisim не выполняет симуляцию Verilog: выходы модуля остаются неизвестными в симуляторе.
verilogValidationSuccessTitle = Проверка Verilog
