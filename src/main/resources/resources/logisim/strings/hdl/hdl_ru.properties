# base/VerilogContent.java, base/VerilogModule.java
#
verilogComponent = Модуль Verilog
verilogDuplicateNameError = Недопустимое имя модуля Verilog. Имена должны быть уникальными.
verilogInvalidNameError = Недопустимое имя модуля Verilog. Имя должно:\n * начинаться с буквы,\n * содержать только буквы, цифры и знаки подчёркивания,\n * не заканчиваться знаком подчёркивания,\n * не содержать два знака подчёркивания подряд.
verilogKeywordNameError = Недопустимое имя модуля Verilog. Это зарезервированное ключевое слово Verilog или VHDL.
verilogModuleName = Имя модуля Verilog
verilogParseError = Ошибка разбора Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = Порт «%s» является массивом. Портами могут быть только одиночные сигналы и шины, например [7:0].
verilogDuplicatePortError = Порт «%s» объявлен дважды.
verilogEmptyError = Модуль пуст. Напишите объявление модуля, например: module name (input a, output q); ... endmodule
verilogEndOfText = конец текста
verilogErrorAtLine = Строка %d: %s
verilogHeaderEndError = После списка портов ожидался символ «;», но найден %s.
verilogIdentifierError = «%s» нельзя использовать здесь в качестве имени. Используйте буквы, цифры и знаки подчёркивания, начиная с буквы или знака подчёркивания.
verilogModuleNameError = После «module» ожидалось имя модуля.
verilogNestedModuleError = Второй модуль начинается до «endmodule». Закройте модуль с помощью «endmodule».
verilogNoEndmoduleError = У модуля «%s» отсутствует «endmodule».
verilogNoModuleError = Не найдено объявление модуля. Текст должен начинаться с: module name ( ... );
verilogNonAnsiError = У порта «%s» не указано направление. Поддерживаются только заголовки в стиле ANSI: объявите каждый порт в заголовке, например (input a, output [7:0] q).
verilogOpenCommentError = Этот комментарий не закрыт символами «*/».
verilogParameterListError = Списки параметров (#(...)) не поддерживаются: Logisim требует фиксированной ширины портов. Используйте localparam внутри модуля.
verilogPortDefaultError = У порта «%s» задано значение по умолчанию, что не поддерживается.
verilogPortExpectedError = Ожидалось объявление порта, например «input a», но найдено %s.
verilogPortSeparatorError = В списке портов ожидались «,» или «)», но найдено %s.
verilogPortTypeError = Ожидалось имя порта, но найдено %s. Поддерживаются типы портов wire, reg и logic, при необходимости с указанием signed.
verilogPortWidthError = Ширина порта «%s» составляет %d бит; поддерживается не более %d бит.
verilogRangeError = Диапазоны портов должны быть целочисленными константами, например [7:0]; выражения и параметры не поддерживаются.
verilogSecondModuleError = Здесь можно описать только один модуль. Добавляйте каждый модуль как отдельный модуль Verilog.
verilogTrailingTextError = Неожиданный %s после «endmodule».
