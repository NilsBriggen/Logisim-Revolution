verilogPortWidthError = Poort '%s' is %d bits breed; maximaal %d bits worden ondersteund.
verilogRangeError = Poortbereiken moeten integer-constanten zijn zoals [7:0]; expressies en parameters worden niet ondersteund.
verilogSecondModuleError = Hier kan slechts één module worden beschreven. Voeg elke module toe als een eigen Verilog-module.
verilogTrailingTextError = Onverwachte %s na 'endmodule'.
