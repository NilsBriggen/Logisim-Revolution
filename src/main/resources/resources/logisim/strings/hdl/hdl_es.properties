verilogComponent = Módulo Verilog
verilogDuplicateNameError = Nombre de módulo Verilog no válido. Los nombres deben ser únicos.
verilogInvalidNameError = Nombre de módulo Verilog no válido. Los nombres deben:\n * comenzar con una letra,\n * contener solo letras, números y guiones bajos,\n * no terminar con un guion bajo,\n * no contener dos guiones bajos consecutivos.
verilogKeywordNameError = Nombre de módulo Verilog no válido. Es una palabra reservada de Verilog o VHDL.
verilogModuleName = Nombre del módulo Verilog
verilogParseError = Error de análisis de Verilog
#
# base/VerilogParser.java
#
verilogArrayPortError = El puerto '%s' es un arreglo. Solo se admiten señales individuales y buses como [7:0] como puertos.
verilogDuplicatePortError = El puerto '%s' está declarado dos veces.
verilogEmptyError = El módulo está vacío. Escriba una declaración de módulo como: module name (input a, output q); ... endmodule
verilogEndOfText = el final del texto
verilogErrorAtLine = Línea %d: %s
verilogHeaderEndError = Se esperaba ';' después de la lista de puertos, se encontró %s.
verilogIdentifierError = '%s' no se puede usar como nombre aquí. Use letras, dígitos y guiones bajos, comenzando con una letra o guion bajo.
verilogModuleNameError = Se esperaba el nombre del módulo después de 'module'.
verilogNestedModuleError = Comienza un segundo módulo antes de 'endmodule'. Cierre el módulo con 'endmodule'.
verilogNoEndmoduleError = El módulo '%s' no tiene 'endmodule'.
verilogNoModuleError = No se encuentra una declaración de módulo. El texto debe comenzar con: module name ( ... );
verilogNonAnsiError = El puerto '%s' no tiene dirección. Solo se admiten encabezados de estilo ANSI: declare cada puerto en el encabezado, p. ej. (input a, output [7:0] q).
verilogOpenCommentError = Este comentario nunca se cierra con '*/'.
verilogParameterListError = Las listas de parámetros (#(...)) no son compatibles: Logisim necesita anchos de puerto fijos. Use localparam dentro del módulo en su lugar.
verilogPortDefaultError = El puerto '%s' tiene un valor predeterminado, lo cual no es compatible.
verilogPortExpectedError = Se esperaba una declaración de puerto como 'input a', se encontró %s.
verilogPortSeparatorError = Se esperaba ',' o ')' en la lista de puertos, se encontró %s.
verilogPortTypeError = Se esperaba un nombre de puerto, se encontró %s. Los tipos de puerto admitidos son wire, reg y logic, opcionalmente signed.
verilogPortWidthError = El puerto '%s' tiene %d bits de ancho; se admiten como máximo %d bits.
verilogRangeError = Los rangos de puerto deben ser constantes enteras como [7:0]; las expresiones y los parámetros no son compatibles.
verilogSecondModuleError = Solo se puede describir un módulo aquí. Añada cada módulo como su propio módulo Verilog.
verilogTrailingTextError = %s inesperado después de 'endmodule'.
