verilogComponent = Verilog Module
verilogDuplicateNameError = Invalid Verilog module name. Names must be unique.
verilogInvalidNameError = Invalid Verilog module name. Names must:\n * start with a letter,\n * contain only letters, numbers, and underscores,\n * not end with an underscore,\n * not contain two consecutive underscores.
verilogKeywordNameError = Invalid Verilog module name. That is a reserved Verilog or VHDL keyword.
verilogModuleName = Verilog Module Name
verilogParseError = Verilog Parsing Error
#
# base/VerilogParser.java
#
verilogArrayPortError = Port '%s' is an array. Only single signals and buses such as [7:0] can be ports.
verilogDuplicatePortError = Port '%s' is declared twice.
verilogEmptyError = The module is empty. Write a module declaration such as: module name (input a, output q); ... endmodule
verilogEndOfText = the end of the text
verilogErrorAtLine = Line %d: %s
verilogHeaderEndError = Expected ';' after the port list, found %s.
verilogIdentifierError = '%s' cannot be used as a name here. Use letters, digits and underscores, starting with a letter or underscore.
verilogModuleNameError = Expected the module name after 'module'.
verilogNestedModuleError = A second module starts before 'endmodule'. Close the module with 'endmodule'.
verilogNoEndmoduleError = Module '%s' has no 'endmodule'.
verilogNoModuleError = Cannot find a module declaration. The text must start with: module name ( ... );
verilogNonAnsiError = Port '%s' has no direction. Only ANSI-style headers are supported: declare every port in the header, e.g. (input a, output [7:0] q).
verilogOpenCommentError = This comment is never closed with '*/'.
verilogParameterListError = Parameter lists (#(...)) are not supported: Logisim needs fixed port widths. Use localparam inside the module instead.
verilogPortDefaultError = Port '%s' has a default value, which is not supported.
verilogPortExpectedError = Expected a port declaration such as 'input a', found %s.
verilogPortSeparatorError = Expected ',' or ')' in the port list, found %s.
verilogPortTypeError = Expected a port name, found %s. Supported port types are wire, reg and logic, optionally signed.
verilogPortWidthError = Port '%s' is %d bits wide; at most %d bits are supported.
verilogRangeError = Port ranges must be integer constants such as [7:0]; expressions and parameters are not supported.
verilogSecondModuleError = Only one module can be described here. Add each module as its own Verilog module.
verilogTrailingTextError = Unexpected %s after 'endmodule'.
