name: Build all platforms and publish release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of vX.Y.Z to raise (auto reads the commits since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the release version
        id: next
        run: |
          version=$(python3 scripts/ci/version.py "${{ inputs.bump }}")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            name: linux-amd64
            tasks: build sourcesJar createAll
            files: |
              build/libs/*-all.jar
              build/libs/*-src.jar
              build/dist/*_amd64.deb
              build/dist/*.x86_64.rpm
          - runner: ubuntu-24.04-arm
            arch: aarch64
            name: linux-arm64
            tasks: build createAll
            files: |
              build/dist/*_arm64.deb
              build/dist/*.aarch64.rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux packaging tools
        run: |
          test "$(uname -m)" = ${{ matrix.arch }}
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fakeroot rpm binutils
      - name: Test and build packages
        run: ./gradlew clean ${{ matrix.tasks }} "-Pversion=${{ needs.version.outputs.version }}" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: |
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (!(Test-Path "$wix\candle.exe") -or !(Test-Path "$wix\light.exe")) {
            throw 'WiX Toolset 3 is unavailable.'
          }
          $env:PATH = "$wix;$env:PATH"
          .\gradlew.bat clean createAll "-Pversion=${{ needs.version.outputs.version }}" --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/dist/*.msi
            build/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            java_arch: x64
            name: macos-amd64
          - runner: macos-15
            arch: arm64
            java_arch: aarch64
            name: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
      - name: Build DMG
        run: |
          test "$(uname -m)" = ${{ matrix.arch }}
          ./gradlew clean createDmg "-Pversion=${{ needs.version.outputs.version }}" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Check that every platform's files are present
        # Artifacts keep their build/libs and build/dist subfolders; release the files flat.
        run: |
          mkdir dist
          find artifacts -type f -exec mv -t dist {} +
          python3 scripts/ci/release.py verify dist "${{ needs.version.outputs.version }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Logisim Revolution $TAG" \
            --generate-notes
