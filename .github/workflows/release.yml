name: Build all platforms and publish release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            name: linux-amd64
            files: |
              build/libs/*-all.jar
              build/libs/*-src.jar
              build/dist/*_amd64.deb
              build/dist/*.x86_64.rpm
          - runner: ubuntu-24.04-arm
            arch: aarch64
            name: linux-arm64
            files: |
              build/dist/*_arm64.deb
              build/dist/*.aarch64.rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux packaging tools
        run: |
          test "$(uname -m)" = ${{ matrix.arch }}
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fakeroot rpm binutils
      - name: Test and build packages
        run: ./gradlew clean build sourcesJar createAll --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: |
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (!(Test-Path "$wix\candle.exe") -or !(Test-Path "$wix\light.exe")) {
            throw 'WiX Toolset 3 is unavailable.'
          }
          $env:PATH = "$wix;$env:PATH"
          .\gradlew.bat clean createAll --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            build/dist/*.msi
            build/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            java_arch: x64
            name: macos-amd64
          - runner: macos-15
            arch: arm64
            java_arch: aarch64
            name: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
      - name: Build DMG
        run: |
          test "$(uname -m)" = ${{ matrix.arch }}
          ./gradlew clean createDmg --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check that every platform's files are present
        run: python3 scripts/ci/release.py verify dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Logisim Revolution build ${GITHUB_SHA::8}" \
            --notes "Build of \`$GITHUB_SHA\`. Native packages: Linux x86_64 and ARM64, Windows x86_64, macOS Intel and Apple Silicon. The portable JAR needs Java 21+."
